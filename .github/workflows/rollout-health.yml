# Rollout-health watch: complements the deploy workflow's run-level alerts.
# The deploy workflow can only alert when ITS OWN run fails; this watch
# catches what that cannot see — FAILED rollouts created outside Actions
# (native git rollouts once the Console repo link exists, manual CLI
# deploys), rollouts stuck PROGRESSING, STALE deploys (main advanced
# past what the live rollout serves, e.g. a cancelled deploy), and
# SERVING-level failures the rollout API cannot see: the live /api/version
# endpoint unreachable or reporting a null commit while Firebase says
# SUCCEEDED, the /status self-check failing, or the /advisor page served
# without the 'freebuff-car-app deploy marker' footer (a pre-marker build
# answering despite the rollout API reporting healthy).
#
# Runs every 30 minutes + manual dispatch. Files/updates the SAME single
# open issue labeled deploy-failure that the deploy workflow uses (one
# failure, one issue), and closes it on recovery. Webhook alerts are
# severity-routed (check-rollout-health.sh emits severity=page|warning):
#   page    — deploy failures + serving outages (failed/stuck/unreachable/
#             unprovenanced/degraded) → POST to ALERT_WEBHOOK_URL
#   warning — rollout-stale (main advanced past what serves; the app still
#             works) → POST to ALERT_WEBHOOK_URL_QUIET (silent channel) when
#             that secret exists; the deploy-failure issue still records it
#             either way, so a quiet warning never silently disappears
# Requires gcloud credentials: FIREBASE_SERVICE_ACCOUNT secret.
name: Rollout health watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_webhook:
        description: 'Force a PAGE-tier unhealthy result to prove webhook delivery end to end (does not touch the deploy-failure issue)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: rollout-health
  cancel-in-progress: false

jobs:
  watch:
    name: Classify rollout health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_URL_QUIET: ${{ secrets.ALERT_WEBHOOK_URL_QUIET }}

    steps:
      # Preflight for the forced webhook proof: test_webhook=true exists to
      # prove page-tier delivery end to end, so with the secret missing the
      # dispatch must fail FAST with the exact setup message — not run the
      # classify/issue steps and fail deep inside the webhook step. The
      # downstream check stays as the safety net; this makes the failure
      # immediate, before any gcloud or Firebase work.
      - name: Preflight webhook secret (test_webhook dispatch)
        if: ${{ inputs.test_webhook == true }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
            echo "::error::Webhook test FAILED — ALERT_WEBHOOK_URL is not set in this repo's Actions secrets. Set it with: gh secret set ALERT_WEBHOOK_URL --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "preflight: ALERT_WEBHOOK_URL is set — proceeding with the forced webhook test"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Activate service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fb-key.json
          chmod 600 /tmp/fb-key.json
          gcloud auth activate-service-account --key-file=/tmp/fb-key.json

      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_MODE: ${{ inputs.test_webhook == true }}
        run: |
          set -euo pipefail
          if [ "$TEST_MODE" = "true" ]; then
            # Forced-unhealthy test mode: exercise the alert path without
            # consulting Firebase or touching the deploy-failure issue.
            {
              echo "test_mode=true"
              echo "outcome=failed"
              echo "detail<<EOF"
              echo "FORCED TEST ALERT — webhook delivery test, no action needed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="$(bash scripts/check-rollout-health.sh)"
          printf '%s\n' "$OUT"
          OUTCOME="$(printf '%s\n' "$OUT" | sed -n 's/^outcome=//p')"
          SEVERITY="$(printf '%s\n' "$OUT" | sed -n 's/^severity=//p')"
          DETAIL="$(printf '%s\n' "$OUT" | sed -n 's/^detail=//p')"
          {
            echo "outcome=$OUTCOME"
            echo "severity=${SEVERITY:-page}"
            echo "detail<<EOF"
            printf '%s\n' "$DETAIL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: File or update the deploy-failure issue
        if: steps.classify.outputs.outcome != 'healthy' && steps.classify.outputs.test_mode != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          DETAIL: ${{ steps.classify.outputs.detail }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label deploy-failure --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"
          BODY="$OUTCOME — $DETAIL
          (detected by the scheduled rollout-health watch)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh label create deploy-failure --repo "$GITHUB_REPOSITORY" --color D93F0B --description "freebuff-car-app Firebase deploy failed" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🚨 Car-app rollout unhealthy ($OUTCOME)" \
              --body "$BODY" \
              --label deploy-failure \
              --assignee "${GITHUB_REPOSITORY_OWNER}"
          fi

      - name: Send webhook alert (severity-routed, Slack/Discord compatible)
        if: steps.classify.outputs.outcome != 'healthy'
        env:
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          SEVERITY: ${{ steps.classify.outputs.severity }}
          DETAIL: ${{ steps.classify.outputs.detail }}
          TEST_MODE: ${{ steps.classify.outputs.test_mode == 'true' }}
        run: |
          set -euo pipefail
          if [ "$SEVERITY" = "warning" ] && [ "$TEST_MODE" != "true" ]; then
            # Silent tier: rollout-stale warnings go to the quiet channel when
            # one exists, and never page. The deploy-failure issue still
            # records the warning (filed by the step above), so nothing is
            # lost — the paging channel just stays calm.
            if [ -n "${ALERT_WEBHOOK_URL_QUIET:-}" ]; then
              TEXT="⚠️ Portfolio rollout warning: $OUTCOME — $DETAIL
              $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              jq -n --arg text "$TEXT" '{text: $text, content: $text}' \
                | curl -sfS -X POST -H 'Content-Type: application/json' -d @- "$ALERT_WEBHOOK_URL_QUIET"
              echo "webhook_delivery=quiet-channel"
            else
              echo "severity=warning and no ALERT_WEBHOOK_URL_QUIET — delivered as the deploy-failure issue only (no webhook)."
            fi
            exit 0
          fi
          if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
            if [ "$TEST_MODE" = "true" ]; then
              echo "::error::Webhook test FAILED — ALERT_WEBHOOK_URL is not set in this repo's Actions secrets. Set it with: gh secret set ALERT_WEBHOOK_URL --repo $GITHUB_REPOSITORY"
              exit 1
            fi
            echo "ALERT_WEBHOOK_URL is not set — skipping webhook delivery (the issue filing still covers this failure)."
            exit 0
          fi
          TEXT="🚨 Portfolio rollout unhealthy: $OUTCOME — $DETAIL
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Slack reads "text", Discord reads "content"; each ignores the other.
          jq -n --arg text "$TEXT" '{text: $text, content: $text}' \
            | curl -sfS -X POST -H 'Content-Type: application/json' -d @- "$ALERT_WEBHOOK_URL"
          echo "webhook_delivery=page-channel"

      - name: Close the deploy-failure issue on recovery
        if: steps.classify.outputs.outcome == 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label deploy-failure --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Rollout healthy again — ${{ steps.classify.outputs.detail }}"
          else
            echo "healthy — no open deploy-failure issue"
          fi

      - name: Remove key file
        if: always()
        run: rm -f /tmp/fb-key.json
