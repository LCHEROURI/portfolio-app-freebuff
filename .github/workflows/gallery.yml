name: Gallery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture README gallery from preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Fork PRs cannot access secrets; skip (not fail) so the check stays green
    # for forks and only runs where a Vercel preview can actually be created.
    # Note: `secrets` is not a valid context in job-level `if`, so the fork
    # guard uses `github` context here and the secret-presence check happens
    # on the steps via job env below.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      # The review-sheet cells (Model Comparison print-all) re-render through
      # the shared verify-review-sheet.mjs driver, which needs the Firebase
      # env trio. When a secret is absent (fork PRs) the driver skip-not-fails
      # via capture-gallery.mjs's NOTE branch — same philosophy as the rest
      # of the job. NOTE: these two cells intentionally capture from the
      # PRODUCTION app (--review-sheet-app default), not this preview: the
      # review sheet needs a signed-in owner with seeded data + live AI, which
      # the demo-mode preview cannot provide. The 18 route cells above always
      # come from the preview; only the review-sheet pair is production-sourced.
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: portfolio-app-freebuff2
      # The deployed-store LIVE-flag set (source of truth: EXPECTED_LIVE_FLAGS
      # in scripts/verify-vercel-env.mjs). Public build-time flags, safe as
      # plain values — declares what the deployed store must carry and locks
      # the workflow to the same set the local gate asserts. The deployments-
      # feed cell (capture-deployments-feed.mjs) FAILS loudly when the live
      # badge is missing, so a deployed store without these flags turns this
      # job red. ci-workflows.test.ts fails if this list and EXPECTED_LIVE_FLAGS
      # ever drift apart.
      NEXT_PUBLIC_LIVE_REPOS: '1'
      NEXT_PUBLIC_LIVE_DEPLOYMENTS: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        # The CDP driver uses native fetch + WebSocket (global in Node 22).
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for headless capture
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Deploy preview of this branch
        id: deploy
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npx --yes vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel build --yes --token="$VERCEL_TOKEN"
          URL="$(npx --yes vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tail -1)"
          echo "Preview URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Wait for preview to answer HTTP 200
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          args=(-s -o /dev/null -m 15 -w '%{http_code}' -L)
          if [ -n "$BYPASS" ]; then
            args+=(-H "x-vercel-protection-bypass: $BYPASS")
          fi
          for i in $(seq 1 30); do
            code="$(curl "${args[@]}" "$PREVIEW_URL/command-center" || true)"
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Preview did not answer HTTP 200 within 300s." >&2
          exit 1
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

      - name: Capture gallery (fails if any cell does not render the app shell)
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          args=(--url "$PREVIEW_URL")
          if [ -n "$BYPASS" ]; then
            args+=(--header "x-vercel-protection-bypass: $BYPASS")
            echo "Using Vercel protection-bypass header for capture."
          fi
          npm run capture:screenshots -- "${args[@]}"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Render onboarding docs to PNG
        # Local-file render of README Handoff + docs/launch.md §4 into
        # screenshots/ — no deployed URL, no secrets, no network. Deliberately
        # NOT gated on the Vercel env trio (unlike the gallery steps above), so
        # the onboarding visuals ship in the artifact even when the preview
        # steps skip (fork PR, missing secrets). Writes into the same
        # screenshots/ dir the upload step collects.
        run: npm run capture:docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload captured screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gallery-screenshots
          path: screenshots/
          if-no-files-found: ignore
