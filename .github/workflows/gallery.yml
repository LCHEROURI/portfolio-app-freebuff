name: Gallery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture README gallery from preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Fork PRs cannot access secrets; skip (not fail) so the check stays green
    # for forks. The 18 route cells themselves need NO secrets — they capture
    # from a locally built demo-mode server (see below). The job-level guard
    # remains for the review-sheet pair, which re-renders through drivers that
    # use the Firebase env trio (secret-presence is checked on the steps).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}

    env:
      # The review-sheet cells (Model Comparison print-all) re-render through
      # the shared verify-review-sheet.mjs driver, which needs the Firebase
      # env trio. When a secret is absent the driver skip-not-fails via
      # capture-gallery.mjs's NOTE branch. NOTE: these two cells intentionally
      # capture from the PRODUCTION app (--review-sheet-app default), not this
      # server: the review sheet needs a signed-in owner with seeded data +
      # live AI, which demo mode cannot provide. The 18 route cells always
      # come from the local demo-mode server; only the review-sheet pair is
      # production-sourced.
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: portfolio-app-freebuff2
      # The deployed-store LIVE-flag set (source of truth: EXPECTED_LIVE_FLAGS
      # in scripts/verify-all.mjs). Public build-time flags, safe as
      # plain values — declares what the deployed store must carry and locks
      # the workflow to the same set the local gate asserts. The deployments-
      # feed cell (capture-deployments-feed.mjs) FAILS loudly when the live
      # badge is missing, so a deployed store without these flags turns this
      # job red. ci-workflows.test.ts fails if this list and EXPECTED_LIVE_FLAGS
      # ever drift apart.
      NEXT_PUBLIC_LIVE_REPOS: '1'
      NEXT_PUBLIC_LIVE_DEPLOYMENTS: '1'
      NEXT_PUBLIC_ENABLE_AI_BRIEFINGS: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        # The CDP driver uses native fetch + WebSocket (global in Node 22).
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for headless capture
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # Demo-mode server: the app builds and runs with ZERO env vars and
      # renders the demo-mode shell the route cells capture. No deploy
      # provider, no deploy credentials, no protection-bypass header, no
      # remote-build flakiness — and car-app-only PRs need no deploy-provider
      # credential just to screenshot the README gallery.
      - name: Build demo-mode production bundle
        run: npm run build

      - name: Start demo-mode server
        id: serve
        run: |
          npx next start -p 4399 > /tmp/demo-server.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Wait for server to answer HTTP 200
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -m 15 -w '%{http_code}' -L http://127.0.0.1:4399/command-center || true)"
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Demo server did not answer HTTP 200 within 300s. Log:" >&2
          tail -50 /tmp/demo-server.log >&2
          exit 1

      - name: Capture gallery (fails if any cell does not render the app shell)
        run: npm run capture:screenshots -- --url http://127.0.0.1:4399
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Stop demo-mode server
        if: always()
        run: |
          PID="${{ steps.serve.outputs.pid }}"
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true

      - name: Render onboarding docs to PNG
        # Local-file render of README Handoff + docs/launch.md §4 into
        # screenshots/ — no deployed URL, no secrets, no network. Runs
        # unconditionally so the onboarding visuals ship in the artifact
        # even when the demo-mode capture above fails. Writes into the same
        # screenshots/ dir the upload step collects.
        run: npm run capture:docs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload captured screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gallery-screenshots
          path: screenshots/
          if-no-files-found: ignore
