name: Preview gate

# Vercel's GitHub integration creates a deployment and posts a
# deployment_status event when it finishes building each deployment (both
# previews and production). This workflow runs the authorized-domains check
# against the DEPLOYED URL itself: the app's own /api/status?project=<origin>
# validates that origin against the Firebase project's authorized list, using
# a throwaway Firebase user's ID token. A non-zero exit fails the check, so
# an unauthorized preview domain blocks shipping before merge. Gated on the
# FIREBASE_WEB_API_KEY secret; only fires on successful deploys.

on:
  deployment_status:

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-preview-auth-domains:
    name: Verify deployed domain is authorized
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` is not a valid context in job-level `if`, so the key presence
    # check happens on the step via job env below.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.target_url != ''

    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # target_url is the live URL Vercel just deployed (preview or
      # production). The script calls that app's own /api/status?project=
      # with the deployed origin, so it needs no extra configuration per URL.
      # Fresh deployment URLs sit behind Vercel's deployment protection, so
      # the VERCEL_PROTECTION_BYPASS secret is forwarded as the same
      # x-vercel-protection-bypass header the gallery capture uses; without it
      # the check would follow a redirect to the SSO wall and see no JSON.
      - name: Verify deployed domain is authorized
        if: ${{ env.FIREBASE_WEB_API_KEY != '' }}
        run: node scripts/verify-auth-domains.mjs --app "${{ github.event.deployment_status.target_url }}"
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
