name: Preview gate

# Vercel's GitHub integration creates a deployment and posts a
# deployment_status event when it finishes building each deployment (both
# previews and production). This workflow runs the authorized-domains check
# against the DEPLOYED URL itself: the app's own /api/status?project=<origin>
# validates that origin against the Firebase project's authorized list, using
# a throwaway Firebase user's ID token. A non-zero exit fails the check, so
# an unauthorized preview domain blocks shipping before merge. Gated on the
# FIREBASE_WEB_API_KEY secret; only fires on successful deploys.

on:
  deployment_status:

concurrency:
  group: preview-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-preview-auth-domains:
    name: Verify deployed domain is authorized
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` is not a valid context in job-level `if`, so the key presence
    # check happens on the step via job env below.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.target_url != ''

    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      # The deployed-store LIVE-flag set (source of truth: EXPECTED_LIVE_FLAGS
      # in scripts/verify-vercel-env.mjs). Public build-time flags, safe as
      # plain values — declares what the deployed store must carry and locks
      # this deployment_status workflow to the same set the local gate asserts
      # and the ci.yml/gallery.yml jobs declare. ci-workflows.test.ts fails if
      # this list and EXPECTED_LIVE_FLAGS ever drift apart.
      NEXT_PUBLIC_LIVE_REPOS: '1'
      NEXT_PUBLIC_LIVE_DEPLOYMENTS: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # target_url is the live URL Vercel just deployed (preview or
      # production). The script calls that app's own /api/status?project=
      # with the deployed origin, so it needs no extra configuration per URL.
      # Fresh deployment URLs sit behind Vercel's deployment protection, so
      # the VERCEL_PROTECTION_BYPASS secret is forwarded as the same
      # x-vercel-protection-bypass header the gallery capture uses; without it
      # the check would follow a redirect to the SSO wall and see no JSON.
      #
      # First, auto-authorize: the freshly deployed URL is brand new, so it is
      # not in the project's authorized list yet. When a service account is
      # configured (FIREBASE_SERVICE_ACCOUNT), add the domain via the Identity
      # Platform admin API so the gate below passes by default; the gate only
      # fails if the automated add itself fails.
      - name: Auto-authorize the deployed domain
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' && env.FIREBASE_WEB_API_KEY != '' }}
        run: node scripts/authorize-domain.mjs --domain "${{ github.event.deployment_status.target_url }}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Verify the deployed domain is authorized. The verify script already
      # sends &refresh=1, but Firebase's own getProjectConfig propagation can
      # lag the admin-API add by tens of seconds — right after a deploy the
      # check can briefly FAIL even though the auto-authorize succeeded (the
      # documented known-transient). So, mirroring the pre-push deployed-hash
      # retry, the gate retries ONCE after a 30s backoff: the propagation
      # clears on the retry and the gate passes, a genuinely unauthorized
      # domain fails both attempts and blocks shipping.
      - name: Verify deployed domain is authorized
        if: ${{ env.FIREBASE_WEB_API_KEY != '' }}
        run: |
          run_verify() {
            node scripts/verify-auth-domains.mjs --app "${{ github.event.deployment_status.target_url }}"
          }
          if run_verify; then
            echo "preview-gate: deployed domain authorized ✓"
          else
            first_rc=$?
            echo "preview-gate: domain check failed (rc=$first_rc) — waiting 30s and retrying once (Firebase getProjectConfig propagation?)…" >&2
            sleep 30
            if run_verify; then
              echo "preview-gate: deployed domain authorized ✓ (on retry)"
            else
              retry_rc=$?
              echo "preview-gate: deployed domain NOT authorized on retry (rc=$retry_rc) — add it to the Firebase authorized list and redeploy." >&2
              exit 1
            fi
          fi
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
