name: Deployed-hash gate

# Vercel's GitHub integration posts a deployment_status event when it finishes
# building each deployment (previews and production). This workflow closes the
# infer-vs-verify gap in CI: it asserts the commit Vercel actually serves at
# the freshly deployed URL matches the commit the push recorded
# (deployment_status.deployment.sha), so drift between GitHub and Vercel — a
# deploy that silently built a stale head, or a redeploy that reverted — fails
# the run automatically. Gated on the VERCEL_TOKEN secret; only fires on
# successful deploys with a target URL.
#
# Boundary: both sides of the assertion (deployment.sha in the GitHub record
# and meta.githubCommitSha in the Vercel API) are written by Vercel's own
# integration, so this detects rollbacks, manual redeploys, and record drift —
# not a hypothetical case where Vercel mislabels every deployment. Also note
# the --url lookup resolves whatever currently points at the canonical alias;
# Vercel sets target_url to the deployment-specific subdomain, which is
# stable, but if the alias ever races ahead of the event the check would
# compare against the newer deployment (a rare false-fail, not a silent pass).
#
# Event-shape note: the deployment_status webhook payload carries the deployed
# commit at the TOP level (github.event.deployment.sha), NOT nested under
# deployment_status (the status object itself has no deployment field — the
# REST statuses API returns "deployment": null). A job-level if that reads
# deployment_status.deployment.sha evaluates to empty and silently skips every
# successful deploy, which is exactly the bug this file was first written with.

on:
  deployment_status:

concurrency:
  group: deployed-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-deployed-hash:
    name: Verify deployed commit matches pushed head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` is not a valid context in job-level `if`, so the token
    # presence check happens on the step via job env below.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.target_url != '' &&
      github.event.deployment.sha != ''

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The event's target_url is the live URL Vercel just deployed (preview
      # or production) and deployment.sha (TOP level) is the commit that push
      # recorded. The script's --url mode resolves that exact deployment via
      # the Vercel API (v13 lookup accepts the canonical alias or the
      # deployment-specific subdomain) and --expect asserts its
      # githubCommitSha matches the pushed head. A mismatch — GitHub thinks X
      # is live, Vercel is serving Y — exits nonzero and fails the check. No
      # VERCEL_PROTECTION_BYPASS needed: this hits the Vercel API, not the
      # SSO-protected deployment URL.
      - name: Echo the event fields being asserted
        run: |
          echo "state:      ${{ github.event.deployment_status.state }}"
          echo "target_url: ${{ github.event.deployment_status.target_url }}"
          echo "sha:        ${{ github.event.deployment.sha }}"
      - name: Verify deployed commit matches the pushed head
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: node scripts/verify-deployed-hash.mjs \
          --url "${{ github.event.deployment_status.target_url }}" \
          --expect "${{ github.event.deployment.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
