name: Deployed-hash gate

# Vercel's GitHub integration posts a deployment_status event when it finishes
# building each deployment (previews and production). This workflow closes the
# infer-vs-verify gap in CI: it asserts the commit Vercel actually serves at
# the freshly deployed URL matches the commit the push recorded
# (deployment_status.deployment.sha), so drift between GitHub and Vercel — a
# deploy that silently built a stale head, or a redeploy that reverted — fails
# the run automatically. Gated on the VERCEL_TOKEN secret; only fires on
# successful deploys with a target URL.
#
# Boundary: both sides of the assertion (deployment.sha in the GitHub record
# and meta.githubCommitSha in the Vercel API) are written by Vercel's own
# integration, so this detects rollbacks, manual redeploys, and record drift —
# not a hypothetical case where Vercel mislabels every deployment. Also note
# the --url lookup resolves whatever currently points at the canonical alias;
# Vercel sets target_url to the deployment-specific subdomain, which is
# stable, but if the alias ever races ahead of the event the check would
# compare against the newer deployment (a rare false-fail, not a silent pass).
#
# Event-shape note: the deployment_status webhook payload carries the deployed
# commit at the TOP level (github.event.deployment.sha), NOT nested under
# deployment_status (the status object itself has no deployment field — the
# REST statuses API returns "deployment": null). A job-level if that reads
# deployment_status.deployment.sha evaluates to empty and silently skips every
# successful deploy, which is exactly the bug this file was first written with.

on:
  deployment_status:

concurrency:
  group: deployed-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-deployed-hash:
    name: Verify deployed commit matches pushed head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` is not a valid context in job-level `if`, so the token
    # presence check happens on the step via job env below.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.target_url != '' &&
      github.event.deployment.sha != ''

    # VERCEL_TEAM_ID is a HINT, not a requirement: the script first tries the
    # team-scoped v13 lookup, then falls back to a bare (unscoped) lookup,
    # because the deployment subdomain is globally unique in Vercel. That
    # fallback is what keeps the gate green even when VERCEL_ORG_ID holds the
    # personal account id instead of the owning team id (the exact 403 the gate
    # hit: forbidden / Not authorized). When the org id IS the correct team,
    # the scoped attempt wins directly; the bare fallback only fires on a
    # rejected scoped lookup.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
      # The deployed-store LIVE-flag set (source of truth: EXPECTED_LIVE_FLAGS
      # in scripts/verify-vercel-env.mjs). Public build-time flags, safe as
      # plain values — declares what the deployed store must carry and locks
      # this deployment_status workflow to the same set the local gate asserts
      # and the ci.yml/gallery.yml jobs declare. ci-workflows.test.ts fails if
      # this list and EXPECTED_LIVE_FLAGS ever drift apart.
      NEXT_PUBLIC_LIVE_REPOS: '1'
      NEXT_PUBLIC_LIVE_DEPLOYMENTS: '1'
      NEXT_PUBLIC_ENABLE_AI_BRIEFINGS: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The event's target_url is the live URL Vercel just deployed (preview
      # or production) and deployment.sha (TOP level) is the commit that push
      # recorded. The script's --url mode resolves that exact deployment via
      # the Vercel API (v13 lookup accepts the canonical alias or the
      # deployment-specific subdomain) and --expect asserts its
      # githubCommitSha matches the pushed head. A mismatch — GitHub thinks X
      # is live, Vercel is serving Y — exits nonzero and fails the check. No
      # VERCEL_PROTECTION_BYPASS needed: this hits the Vercel API, not the
      # SSO-protected deployment URL.
      - name: Echo the event fields being asserted
        run: |
          echo "state:      ${{ github.event.deployment_status.state }}"
          echo "target_url: ${{ github.event.deployment_status.target_url }}"
          echo "sha:        ${{ github.event.deployment.sha }}"
      # NOTE: these steps use `run: |` block scalars ON PURPOSE. A plain
      # scalar `run: cmd \` folds the trailing backslash-newline into a
      # literal backslash-space, so `--url "…"` arrives in bash as the single
      # word ` --url` (leading space) and the script never parses the flag —
      # silently falling back to the v6 list branch, which 403s on the wrong
      # team scope. Real newlines (block scalar) keep the backslash as a
      # genuine line continuation.
      - name: Verify deployed commit matches the pushed head
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          node scripts/verify-deployed-hash.mjs \
            --url "${{ github.event.deployment_status.target_url }}" \
            --expect "${{ github.event.deployment.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Alias-routing drift watch: for PRODUCTION deployments only, assert the
      # canonical alias (portfolio-app-freebuff.vercel.app) serves the SAME
      # commit as the deployment-specific target_url just verified above. The
      # script's --compare-url mode compares the primary (--url) against the
      # canonical alias; a mismatch means routing points at a different build
      # than the one the previous step proved live. Previews are skipped: a
      # preview URL legitimately differs from the canonical production alias,
      # so the comparison would false-fail there.
      - name: Alias-routing drift watch (production)
        if: ${{ env.VERCEL_TOKEN != '' && github.event.deployment_status.environment == 'Production' }}
        run: |
          node scripts/verify-deployed-hash.mjs \
            --url "${{ github.event.deployment_status.target_url }}" \
            --compare-url "https://portfolio-app-freebuff.vercel.app"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Machine-reproven teeth: after a successful PRODUCTION deploy, re-run
      # the gate-stale proof (gate FAIL path + stale-guard) against live from
      # the pushed commit's PARENT, so the stale-guard teeth are proven on the
      # real runner after every deploy — not just via the npm one-liners. By
      # construction, live == the pushed commit right after the deploy, so
      # both verdicts reproduce from the parent. Skip-not-fail on the
      # transient edge: right after a deploy the canonical alias can still
      # serve the previous commit (alias promotion lag) or the API can hiccup
      # — in those states the verdicts cannot reproduce, so the wrapper prints
      # a loud SKIP instead of failing the run. Only a proof that CAN
      # reproduce is allowed to fail. Production-only: the proof resolves the
      # canonical PRODUCTION alias, so on preview deployments (where the
      # checkout is the PR head) the comparison would be meaningless.
      # Gated on VERCEL_TOKEN like the hash steps.
      - name: Verify gate-stale proof after deploy (teeth)
        if: ${{ env.VERCEL_TOKEN != '' && github.event.deployment_status.environment == 'Production' }}
        run: node scripts/verify-gate-stale-ci.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
