name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-verify of a past commit: run the full gate suite against an
  # explicit commit sha without pushing a new commit. Blank = the ref head
  # (the commit the workflow was dispatched on).
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit sha to re-verify (blank = ref head)
        required: false
        default: ''

# Push/PR runs share one per-ref group so only the newest lands (a newer push
# cancels the older run — the 8af5278-vs-62b94f8 case). Manual re-verify runs
# get their own group keyed by the requested sha, so a fresh push can never
# cancel a re-verify that is explicitly checking a past commit.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('reverify-{0}', github.event.inputs.commit_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Manual re-verify: check out the requested commit sha. On push/PR
          # this falls back to the ref head, identical to the old behavior.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.ref }}

      # Guard: the Firebase project id is portfolio-app-freebuff2 (with the
      # trailing 2). A bare portfolio-app-freebuff in a FIREBASE CONTEXT
      # (project-id env var, auth domain, storage bucket, service-account
      # email, or Identity Platform admin path) would silently revert the
      # freebuff2 migration. Legitimate references are never flagged: the
      # GitHub repo name (LCHEROURI/portfolio-app-freebuff), the Vercel app URL
      # (.vercel.app), Vercel preview domains (-xxx.vercel.app), and Vercel
      # settings URLs (vercel.com). ci.yml is excluded because the guard text
      # itself mentions the old id; its verify jobs pin freebuff2 and fail the
      # run if that ever changes.
      - name: Guard Firebase project id (must stay freebuff2)
        run: |
          BAD=$(grep -RInE \
            'NEXT_PUBLIC_FIREBASE_PROJECT_ID=portfolio-app-freebuff([^2]|$)|portfolio-app-freebuff\.(firebaseapp|web|firebasestorage)\.|@portfolio-app-freebuff\.iam\.gserviceaccount|projects/portfolio-app-freebuff/' \
            --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.py' \
            --include='*.yml' --include='*.yaml' --include='*.md' --include='*.sh' \
            --include='*.rules' --include='*.env.example' --include='*.json' \
            --exclude='ci.yml' . 2>/dev/null \
            | grep -v 'portfolio-app-freebuff2' \
            | grep -v 'vercel\.com' || true)
          if [ -n "$BAD" ]; then
            echo "✗ bare 'portfolio-app-freebuff' used as a Firebase project id (must be portfolio-app-freebuff2):"
            echo "$BAD"
            exit 1
          fi
          echo "✓ no bare 'portfolio-app-freebuff' Firebase project id references"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  # Drift guard for the launch checklist: parses docs/launch.md's §4 gate
  # table and asserts every documented command is actually runnable from
  # package.json (npm scripts exist, target files exist, node scripts/ gates
  # have a canonical alias). A gate added to the doc without a matching script
  # — or a script renamed without updating the doc — fails the run, so the
  # checklist can never promise a command the repo can't run. Static and
  # secret-free: runs on every push, PR, and manual re-verify, no Node
  # install needed.
  verify-launch-checklist:
    name: Verify launch checklist matches scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Manual re-verify: check out the requested commit sha. On push/PR
          # this falls back to the ref head, identical to the old behavior.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.ref }}

      - name: Verify launch-checklist gates are runnable
        run: node scripts/verify-launch-checklist.mjs

  # Post-deploy smoke tests against the LIVE app. Every push (or manual
  # re-verify via workflow_dispatch) proves the deployed cron-email bodies
  # (gated on CRON_SECRET) and the deployed Firestore rules (gated on
  # FIREBASE_WEB_API_KEY) behave end to end, in one job. Each step is gated
  # on its secret so forks / unconfigured repos stay green and only run where
  # a real deploy exists. NOTE: on a manual re-verify of a non-head SHA, the
  # checked-out (past) verify scripts run against today's live deployment —
  # for adjacent commits that is identical; re-verifying an old commit after
  # script drift tests the live app with that commit's assertions.
  verify-deployed:
    name: Verify deployed email + rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    # Job-level env is the only place secrets can be read for step gating
    # (`secrets` is not a valid context in `if:`). An unset secret becomes an
    # empty string, so `env.X != ''` gates each step cleanly.
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REPORT_FROM: ${{ secrets.REPORT_FROM }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Manual re-verify: check out the requested commit sha. On push/PR
          # this falls back to the ref head, identical to the old behavior.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Vercel token health: proves the CI VERCEL_TOKEN (the same secret the
      # deployed-hash + gallery workflows consume) is still alive, reporting
      # its name and expiry. This runs on the push, BEFORE Vercel finishes
      # building and the deployment_status job starts — so a revoked or
      # expiring token fails the run here with the targeted
      # paste-a-fresh-token guidance instead of surfacing as a confusing 403
      # inside the deployed-hash gate minutes later. Gated on the secret so
      # forks / unconfigured repos stay green.
      - name: Verify Vercel token health
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: node scripts/verify-token-health.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Resend API key health: proves the RESEND_API_KEY the Automation
      # Engine uses to send daily/weekly reports still authenticates, and
      # asserts REPORT_FROM points at a verified custom sender domain (DNS
      # TXT probe for the Resend SPF/DKIM records), not the onboarding@resend.dev
      # sandbox. A revoked key or a sandbox-bound sender fails the run here
      # with targeted guidance instead of silently skipping every email.
      # Read-only probes (GET /api-keys + DNS) — sends no email. Gated on the
      # secret so forks / unconfigured repos stay green.
      - name: Verify Resend API key health
        if: ${{ env.RESEND_API_KEY != '' }}
        run: node scripts/verify-resend.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}

      - name: Verify deployed cron email bodies
        if: ${{ env.CRON_SECRET != '' }}
        run: node scripts/verify-cron-email.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Verify deployed Firestore rules
        if: ${{ env.FIREBASE_WEB_API_KEY != '' }}
        run: node scripts/verify-firestore-rules.mjs
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: portfolio-app-freebuff2

      # Google sign-in IdP smoke check: asserts the SDK surface the Google
      # popup actually reads — accounts:createAuthUri with providerId
      # google.com must resolve and embed a classic web client id. (The older
      # v3 getProjectConfig idpConfig array is empty on this project even when
      # the provider is enabled, so it cannot gate sign-in.) A provider
      # missing from the config store fails the deploy before any user clicks
      # the Google button.
      - name: Verify Google sign-in IdP config
        if: ${{ env.FIREBASE_WEB_API_KEY != '' }}
        run: node scripts/verify-google-idp.mjs
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: portfolio-app-freebuff2

  # Post-deploy authorized-domains smoke test. Mints a throwaway Firebase
  # user, calls the deployed /api/status?project=<domain> and fails the run
  # when the validated domain is NOT in the project's authorized list — so an
  # unauthorized (preview) domain blocks shipping before any user hits the
  # sign-in gate. Defaults to validating the production URL; pass a preview
  # deployment URL to validate it before it ships. Gated on the
  # FIREBASE_WEB_API_KEY secret so forks / unconfigured repos stay green.
  verify-auth-domains:
    name: Verify authorized domains
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    # Same secrets-in-if restriction as above: gate the step on job env.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Manual re-verify: check out the requested commit sha. On push/PR
          # this falls back to the ref head, identical to the old behavior.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed authorized domains
        if: ${{ env.FIREBASE_WEB_API_KEY != '' }}
        run: node scripts/verify-auth-domains.mjs
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

      # Service-account key validity: run the auto-authorize script against
      # the production URL. The production domain is already authorized, so
      # this is an idempotent no-op that proves the SA key itself can mint a
      # token and read the admin config — catching a rotated/expired
      # FIREBASE_SERVICE_ACCOUNT before a deployment_status event needs it.
      - name: Verify auto-authorize service account key
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: node scripts/authorize-domain.mjs --domain "https://portfolio-app-freebuff.vercel.app"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: false

  # Post-deploy sign-in smoke test against the LIVE production URL. Drives a
  # real headless-Chrome session via CDP: mints a throwaway Firebase user,
  # types the credentials into the AuthGate form, asserts the gate releases
  # into the Command Center shell, and proves Firestore read/write sync under
  # the real account. Also asserts Google sign-in readiness: the Google button
  # renders on the AuthGate AND the google.com IdP config is enabled via the
  # admin API (FIREBASE_SERVICE_ACCOUNT) — so a missing Google provider blocks
  # the deploy, not just local runs. A broken sign-in or a Firestore rules
  # regression fails the run. Gated on FIREBASE_WEB_API_KEY so forks /
  # unconfigured repos stay green and the check only runs where a real
  # deployment exists.
  verify-prod-signin:
    name: Verify production sign-in + Firestore sync
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: validate
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Manual re-verify: check out the requested commit sha. On push/PR
          # this falls back to the ref head, identical to the old behavior.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome for headless CDP
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify production sign-in and Firestore sync
        if: ${{ env.FIREBASE_WEB_API_KEY != '' }}
        run: node scripts/verify-prod-signin.mjs
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: portfolio-app-freebuff2
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
