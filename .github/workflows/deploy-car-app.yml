# Car-app deploy: builds and deploys freebuff-car-app to its Firebase App
# Hosting backend (freebuff-car-app, project portfolio-app-freebuff2) whenever
# car-app files change on main. Deploys run scripts/deploy-car-app.sh, which
# performs the same steps as `firebase deploy --only apphosting` but labels
# the build and rollout with the commit SHA and run URL, so the rollout
# history in the Firebase Console is self-describing (no Console repo link
# needed).
#
# Auth: reuses the repo's FIREBASE_SERVICE_ACCOUNT secret (a full service
# account JSON key). The key is written to a temp file and used to activate
# the service account for gcloud (API calls in the deploy script).
#
# Failure alerting: when the deploy job fails, notify-failure files (or
# updates) a single open issue labeled deploy-failure — the repo owner is
# assigned, so GitHub emails them — and, if the ALERT_WEBHOOK_URL secret is
# set, also POSTs to that Slack/Discord-compatible webhook. When a later
# deploy succeeds, notify-success closes any open deploy-failure issue, so
# the alert lifecycle is self-managing. A run cancelled by a newer push is
# NOT an alert: concurrency cancels only superseded deploys, and the newer
# run owns the outcome.
#
# Manual re-deploy of a past commit: dispatch with commit_sha to deploy a
# specific commit through the SAME labeled pipeline (rollout labels, GitHub
# Deployment record, failure issue, and the verify-deployed probe all name
# the commit actually deployed). Blank = the ref head (the commit the
# workflow was dispatched on).
name: Deploy car app

on:
  push:
    branches: [main]
    paths:
      - 'freebuff-car-app/**'
      - '.github/workflows/deploy-car-app.yml'
  # Manual re-deploy of a past commit: deploy a specific commit without
  # pushing a new commit. Blank = the ref head.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit sha to deploy (blank = ref head)
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  deployments: write

# Push runs share one per-ref group so only the newest deploy lands (and a
# re-run of a FAILED deploy stays in the same group, re-deploying the same
# commit). A dispatch re-deploy gets its own redeploy-{sha} group — a fresh
# push (different group) can never cancel a manual re-deploy of a past
# commit, and cancel stays off on dispatch so a newer dispatch can't cancel
# an older one either.
concurrency:
  group: deploy-car-app-${{ github.event_name == 'workflow_dispatch' && format('redeploy-{0}', github.event.inputs.commit_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  deploy:
    name: Build & deploy freebuff-car-app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      deployed_sha: ${{ steps.resolve.outputs.sha }}

    steps:
      # Manual re-deploy: actions/checkout only accepts a FULL 40-hex commit
      # sha (a short sha like 0fb4954 is fetched as refs/heads/0fb4954* and
      # fails with a cryptic git error). Fail fast with the actionable message
      # instead. Blank (push and blank dispatch) skips this guard.
      - name: Validate re-deploy commit sha (must be full 40-hex)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha != '' }}
        run: |
          SHA="${{ github.event.inputs.commit_sha }}"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha '$SHA' is not a full 40-hex commit sha. Paste the full sha"
            echo "::error::(git rev-parse <ref>) — a short sha cannot be checked out."
            exit 1
          fi
          echo "✓ re-deploy sha $SHA is a full 40-hex commit"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Pin to the exact commit this run deploys: on push that's
          # github.sha (a re-run deploys the same code — the 8182177 rerun
          # drift), on dispatch it's the requested past commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.sha }}

      # The sha this run actually deploys: on push it's github.sha, but on a
      # dispatch re-deploy github.sha names the REF HEAD the dispatch ran on
      # — labeling the rollout with the WRONG commit. Every label and probe
      # below (rollout labels, GitHub Deployment record, failure issue,
      # verify-deployed) must use this resolved sha, not github.sha.
      - name: Resolve deployed commit sha
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freebuff-car-app/package-lock.json

      - name: Install dependencies
        working-directory: freebuff-car-app
        run: npm ci

      - name: Typecheck
        working-directory: freebuff-car-app
        run: npx tsc --noEmit

      - name: Test
        working-directory: freebuff-car-app
        run: npx jest --ci

      - name: Build
        working-directory: freebuff-car-app
        run: npx next build

      # One key file for the whole job: gcloud (for API calls below) and
      # firebase-tools (GOOGLE_APPLICATION_CREDENTIALS) both authenticate from
      # it. Removed in the always-run cleanup step at the bottom.
      - name: Activate service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fb-key.json
          chmod 600 /tmp/fb-key.json
          gcloud auth activate-service-account --key-file=/tmp/fb-key.json

      - name: Deploy to Firebase App Hosting (labeled rollout)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fb-key.json
          GITHUB_SHA: ${{ steps.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.resolve.outputs.sha }}
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
        run: bash scripts/deploy-car-app.sh

      # GitHub-side provenance: a Deployment on this commit with the live URL,
      # visible on the commit page and via the Deployments API. Bookkeeping
      # only — continue-on-error so a GitHub API hiccup can never fail the
      # job and trigger a false "deploy failed" alert (the Firebase rollout
      # has already SUCCEEDED by this point).
      - name: Record GitHub Deployment for this commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.resolve.outputs.sha }}
          BACKEND_URL: https://freebuff-car-app--portfolio-app-freebuff2.us-central1.hosted.app
        run: |
          set -euo pipefail
          # auto_merge is a boolean and required_contexts an array; build the
          # body with jq because -f sends plain strings (HTTP 422 otherwise).
          BODY="$(jq -n \
            --arg ref "$GITHUB_SHA" \
            --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{ref: $ref, environment: "car-app-production", auto_merge: false, required_contexts: [], description: "Firebase App Hosting rollout", log_url: $log_url}')"
          DEPLOYMENT_ID="$(printf '%s' "$BODY" | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f environment_url="$BACKEND_URL"

      - name: Write deploy summary
        env:
          GITHUB_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "## Car-app deploy ✓"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Firebase rollout | \`${ROLLOUT_NAME##*/}\` (created $ROLLOUT_CREATE) |"
            echo "| Live URL | https://freebuff-car-app--portfolio-app-freebuff2.us-central1.hosted.app |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key file
        if: always()
        run: rm -f /tmp/fb-key.json

  notify-failure:
    name: Alert on failed deployment
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      GITHUB_SHA: ${{ needs.deploy.outputs.deployed_sha }}

    steps:
      - name: Create or update the deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_RESULT" != "failure" ]; then
            echo "deploy result: $DEPLOY_RESULT — not alerting"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          BODY="The freebuff-car-app deploy to Firebase App Hosting FAILED.

          - Run: $RUN_URL
          - Commit: $COMMIT_URL ($SHORT_SHA)
          - Triggered by: $GITHUB_ACTOR

          The previous build is still serving. Fix, push, and this issue will
          close automatically when the next deploy succeeds."

          # One open failure issue at a time: comment on it if it exists.
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label deploy-failure --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing — $BODY"
          else
            gh label create deploy-failure --repo "$GITHUB_REPOSITORY" --color D93F0B --description "freebuff-car-app Firebase deploy failed" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🚨 Car-app deploy failed on main ($SHORT_SHA)" \
              --body "$BODY" \
              --label deploy-failure \
              --assignee "${GITHUB_REPOSITORY_OWNER}"
          fi

      # Page-tier alert: a failed deploy is always a page — it goes to the
      # ALERT_WEBHOOK_URL channel (never the quiet one), mirroring the
      # severity routing in rollout-health.yml. The step must ALSO be gated
      # on the deploy actually failing: with only the env check, every
      # successful deploy sent a false "deploy FAILED" page (seen on run
      # 33990351688 after the deploy SUCCEEDED), because notify-failure runs
      # with `if: always()` and the webhook step lacked the result guard the
      # issue step has.
      #
      # Preflight (mirrors rollout-health.yml's test_webhook guard): when the
      # deploy failed, the page MUST fire — so a missing ALERT_WEBHOOK_URL is
      # itself an incident. Instead of the silent `&& env.ALERT_WEBHOOK_URL
      # != ''` skip, fail loudly with the setup message so an unconfigured
      # channel can never silently swallow a failed deploy.
      - name: Send webhook alert (Slack/Discord compatible)
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          set -euo pipefail
          if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
            echo "::error::Deploy FAILED but ALERT_WEBHOOK_URL is not set in this repo's Actions secrets. Set it with: gh secret set ALERT_WEBHOOK_URL --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          TEXT="🚨 freebuff-car-app deploy FAILED on main (${GITHUB_SHA::7}) — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Slack reads "text", Discord reads "content"; each ignores the other.
          jq -n --arg text "$TEXT" '{text: $text, content: $text}' \
            | curl -sfS -X POST -H 'Content-Type: application/json' -d @- "$ALERT_WEBHOOK_URL"

  # Post-deploy provenance proof: the rollout API can say SUCCEEDED while
  # serving is broken or a stale build answers (the rollout-health watch
  # catches that on a 30-minute clock). This job closes the gap at deploy
  # time: poll the LIVE /api/version endpoint until it reports the pinned
  # github.sha of THIS run — proving traffic actually serves the commit this
  # deploy produced, not an older rollout or a misrouted backend. Runs only
  # when the deploy job itself succeeded (a failed deploy keeps the previous
  # build serving — that is expected, not an error to verify against).
  verify-deployed:
    name: Verify live /api/version serves the pinned commit
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Poll live /api/version until commitFull equals github.sha
        env:
          # The commit THIS run deployed — on push github.sha, on a dispatch
          # re-deploy the requested past commit (github.sha would name the ref
          # head, so the probe would compare against the wrong commit).
          EXPECTED_SHA: ${{ needs.deploy.outputs.deployed_sha }}
          BACKEND_URL: https://freebuff-car-app--portfolio-app-freebuff2.us-central1.hosted.app
        run: |
          set -euo pipefail
          # App Hosting takes a moment to switch traffic after the rollout op
          # reports SUCCEEDED — poll up to ~5 minutes (30 × 10s) so a healthy
          # in-flight switch never fails the run. A 200 + matching full sha is
          # the success condition; anything else keeps polling, and a timeout
          # fails LOUDLY (the rollout claimed success but the live app does
          # not serve this commit).
          MATCHED=0
          for i in $(seq 1 30); do
            HTTP_CODE="$(curl -sS -o /tmp/car-version.json -w '%{http_code}' -m 30 "$BACKEND_URL/api/version" 2>/dev/null || echo 000)"
            COMMIT_FULL="$(jq -r '.commitFull // empty' /tmp/car-version.json 2>/dev/null || true)"
            echo "[$i] http=$HTTP_CODE commitFull=${COMMIT_FULL:-<none>} (expected $EXPECTED_SHA)"
            if [ "$HTTP_CODE" = "200" ] && [ "$COMMIT_FULL" = "$EXPECTED_SHA" ]; then
              MATCHED=1
              break
            fi
            sleep 10
          done
          if [ "$MATCHED" != "1" ]; then
            echo "::error::Deploy reported SUCCEEDED but the live /api/version does not serve ${EXPECTED_SHA::7} after 5 minutes (last http=$HTTP_CODE commit=${COMMIT_FULL:-none}) — traffic is serving a different build."
            exit 1
          fi
          echo "✓ live /api/version serves the pinned commit ${EXPECTED_SHA::7}"

  notify-success:
    name: Close deploy-failure issue on recovery
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITHUB_SHA: ${{ needs.deploy.outputs.deployed_sha }}

    steps:
      - name: Close any open deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "deploy result: $DEPLOY_RESULT — nothing to close"
            exit 0
          fi
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label deploy-failure --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Resolved: deploy of ${GITHUB_SHA::7} succeeded — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "No open deploy-failure issue — nothing to close."
          fi
